name: Barrierefreiheit (ESLint + Playwright/axe-core)

# Pflichtprüfung für jeden Pull Request. Auf main läuft sie nicht erneut: Dorthin gelangt nur,
# was im PR bereits geprüft wurde. Manuell startbar über workflow_dispatch.
#
# Betrifft ein PR keinen Anwendungscode (z. B. nur Doku), wird der Job „a11y“ übersprungen. Bewusst kein
# paths-Filter am Trigger: Ein nicht gestarteter Pflicht-Check bliebe „ausstehend“ und blockierte den Merge,
# ein übersprungener Job zählt dagegen als bestanden.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Alle Muster müssen zutreffen: Datei liegt im Anwendungscode und ist keine Markdown-Datei.
          predicate-quantifier: every
          filters: |
            app:
              - '{packages/**,apps/**,e2e/**,eslint-rules/**,eslint.config.js,playwright.config.ts,tsconfig.e2e.json,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,.github/workflows/a11y.yml}'
              - '!**/*.md'

  a11y:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Statische Prüfung: eslint-plugin-jsx-a11y (axe-core-Regeldaten) und Fink-Regeln gegen Ellipsis-Kürzung.
      - run: pnpm lint

      - run: pnpm build

      # KoliBri-Texte passen zur installierten Version (ohne Auslassungszeichen).
      - run: pnpm locales:check

      - run: pnpm exec playwright install --with-deps chromium

      # axe-core (WCAG 2.2 AA, EN 301 549 / BITV 2.0, Best Practices) über alle Routen, Sprachen, Farbschemata,
      # 320 px und interaktive Zustände der Kompositionen.
      - run: pnpm test:a11y

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
